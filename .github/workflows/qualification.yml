name: Local player qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        language: [javascript, typescript, vane, cadence, glyph]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - if: matrix.language == 'typescript'
        run: npm install --global typescript@6.0.2 --ignore-scripts --no-audit --no-fund
      - run: npx --yes @clunkyard/cli@2 new ${{ matrix.language }} robot
      - run: npx --yes @clunkyard/cli@2 --project robot doctor
      - run: npx --yes @clunkyard/cli@2 --project robot match
      - run: npx --yes @clunkyard/cli@2 --project robot match 77 3d zero-g
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [c, python]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npx --yes @clunkyard/cli@2 new ${{ matrix.language }} robot
      - run: npx --yes @clunkyard/cli@2 --project robot doctor
      - run: npx --yes @clunkyard/cli@2 --project robot match
